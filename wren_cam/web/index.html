<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wren-cam</title>
  <link rel="icon" type="image/png" href="/assets/wren.png" />
  <link rel="apple-touch-icon" href="/assets/wren.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a href="/" class="brand">
      <img src="/assets/wren.png" alt="" class="brand-icon" />
      <img src="/assets/wren-cam.png" alt="wren-cam" class="brand-wordmark" />
    </a>
    <nav>
      <button data-tab="live" class="active">Live</button>
      <button data-tab="settings">Settings</button>
      <button data-tab="recordings">Recordings</button>
    </nav>
    <div class="auth">
      <span id="auth-state"></span>
      <button id="auth-btn" class="secondary">Login</button>
    </div>
  </header>

  <main>
    <section id="tab-live" class="tab active">
      <div id="cam-grid"></div>
    </section>

    <section id="tab-settings" class="tab">
      <div id="app-settings"></div>
      <div id="camera-settings"></div>
    </section>

    <section id="tab-recordings" class="tab">
      <div class="row">
        <button id="refresh-recordings">Refresh</button>
        <label class="date-pick">Date
          <select id="recordings-date"></select>
        </label>
        <span id="recordings-count"></span>
        <button id="delete-day" class="danger admin-only" style="margin-left:auto">Delete all for this day</button>
      </div>
      <ul id="recordings-list"></ul>
      <div class="row pager" id="recordings-pager" hidden>
        <button id="recordings-prev" class="secondary">← Newer</button>
        <span id="recordings-page"></span>
        <button id="recordings-next" class="secondary">Older →</button>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <div id="login-modal" class="modal" hidden>
    <div class="modal-box">
      <h2>Admin login</h2>
      <p class="modal-hint">Enter the admin password to change settings and delete recordings.</p>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
      <div class="row" style="margin-top:0.75rem;justify-content:flex-end">
        <button id="login-cancel" class="secondary">Cancel</button>
        <button id="login-submit">Log in</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
